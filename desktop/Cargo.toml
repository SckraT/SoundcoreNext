[package]
name = "soundcore-desktop"
version = "2.0.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
slint = "1.18"
soundcore-models = { path = "../core/crates/models" }
soundcore-session = { path = "../core/crates/session" }
windows = { version = "0.62", features = [
    "Win32_Devices_Bluetooth",
    "Win32_Foundation",
    "Win32_Networking_WinSock",
] }

[build-dependencies]
slint-build = "1.18"
