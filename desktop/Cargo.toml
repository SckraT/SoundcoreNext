[package]
name = "soundcore-desktop"
version = "2.0.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
# The About rows' copy button puts their text on the Windows clipboard; the
# image half of arboard is not needed.
arboard = { version = "3.7", default-features = false }
slint = "1.18"
soundcore-models = { path = "../core/crates/models" }
# The pure saved-profile model (name + eight bands, validation, JSON schema v1);
# the file IO lives in the controller.
soundcore-profiles = { path = "../core/crates/profiles" }
soundcore-session = { path = "../core/crates/session" }
windows = { version = "0.62", features = [
    "Win32_Devices_Bluetooth",
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    # The Connections page's links open the Windows settings pages.
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
# The controller tests rebuild fixture frames, so they use the core's checksum
# instead of a hand-written copy of the protocol rule.
soundcore-protocol = { path = "../core/crates/protocol" }
