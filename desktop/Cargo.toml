[package]
name = "soundcore-desktop"
version = "2.0.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
# The About rows' copy button and the Import and export panel's Copy button put
# their text on the Windows clipboard, and the Import dialog reads the clipboard
# for a pasted profiles file; the image half of arboard is not needed.
arboard = { version = "3.7", default-features = false }
# The Import dialog's Windows file picker and the Export save dialog. The default
# features are the Linux xdg-portal and Wayland backends; the Windows backend
# needs none of them.
rfd = { version = "0.17", default-features = false }
slint = "1.18"
soundcore-models = { path = "../core/crates/models" }
# Diagnostics records the raw tx/rx frames and parses the replies before the
# redacted session is exported.
soundcore-protocol = { path = "../core/crates/protocol" }
# Read-only diagnostic probes and the local ZIP bundle; the controller owns the
# worker and file save, the crate owns probe order and redaction.
soundcore-diagnostics = { path = "../core/crates/diagnostics" }
# The pure saved-profile model (name + eight bands, validation, JSON schema v1);
# the file IO lives in the controller.
soundcore-profiles = { path = "../core/crates/profiles" }
soundcore-session = { path = "../core/crates/session" }
windows = { version = "0.62", features = [
    "Win32_Devices_Bluetooth",
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    # The single-instance mutex and event. The two creation calls take a
    # `SECURITY_ATTRIBUTES` pointer, which the windows crate gates behind
    # `Win32_Security` as well (the reference app enables the same pair).
    "Win32_Security",
    "Win32_System_Threading",
    # The Connections page's links open the Windows settings pages.
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.18"
