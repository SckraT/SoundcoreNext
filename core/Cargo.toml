[workspace]
members = [
    "crates/protocol",
    "crates/models",
    "crates/diagnostics",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://example.invalid/soundcore-next"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soundcore-protocol = { path = "crates/protocol" }
soundcore-models = { path = "crates/models" }
